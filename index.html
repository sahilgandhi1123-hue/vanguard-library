We built receivers not to amplify, but to subtract. What remains after you remove all known interference is not nothing. It is the signal.

The field does not broadcast. It waits to be noticed by those who have learned how to stop listening.`},{id:"c2",title:"Field Mechanics",content:`The resonant field exists orthogonal to electromagnetic spectra. It cannot be measured directly, only inferred through its effect on coherent systems. A tuning fork in a vacuum, a quartz lattice under stress, a human nervous system in deep meditation - all become detectors when properly isolated.

Vanguard's early experiments failed because they added energy. The breakthrough came when we removed it. Cryogenic silence. Anechoic mind.`}]},{id:"b2",title:"STATIC GHOSTS",desc:"An archive of lost transmissions recovered from decommissioned relay stations.",gradient:"from-amber-950 via-stone-900 to-zinc-900",chapters:[{id:"c3",title:"Relay 7 Logs",content:`DATE: 1987-11-03
STATUS: UNEXPLAINED CARRIER
We recorded 14 minutes of absolute zero on all bands simultaneously. Not noise. Not silence. A third state. Tape shows magnetic alignment without external field.

Operator on duty reported "feeling watched by the static". Psych eval clear. Relay decommissioned next week.`}]},{id:"b3",title:"THE LISTENERS",desc:"Profiles of individuals who claim persistent reception. Unverified, documented.",gradient:"from-neutral-900 via-zinc-800 to-neutral-900",chapters:[{id:"c4",title:"Subject L-09",content:'Can describe events occurring in sealed rooms three floors away. No visual contact. Claims she "hears the shape" of rooms. When asked to demonstrate, accuracy 73% over 200 trials. Not paranormal. She has learned to read resonant deformation.'}]},{id:"b4",title:"NULL CODE",desc:"Operational security for resonant communication. How to speak without being heard.",gradient:"from-stone-900 via-zinc-900 to-neutral-800",chapters:[{id:"c5",title:"Vapor Letters",content:`The safest message is one that exists only as a pattern of deletions. Write a full page, then erase everything except what matters. The erasure is the encryption. Those who know the original text can read the gaps. Those who don't see only a ruined page.

Resonants don't hum because humming is disclosure.`}]},{id:"b5",title:"VANGUARD MANIFESTO",desc:"Why we built the library. Why we keep it offline. Why we whisper.",gradient:"from-zinc-800 via-stone-800 to-zinc-900",chapters:[{id:"c6",title:"Intent",content:`We are not a network. Networks are traceable. We are a library. Libraries are visited, not joined.

Every book here was written in isolation and deposited without announcement. The archive grows because individuals choose to remember the same silence.

Resonants don't hum. But they do keep records.`}]},{id:"b6",title:"COUNTER-RESONANCE",desc:"Techniques for disrupting hostile field imposition. Defensive theory only.",gradient:"from-neutral-800 via-zinc-900 to-stone-900",chapters:[{id:"c7",title:"White Field",content:`To counter a resonant intrusion, do not block. Broadcast your own silence louder. Generate a field of pure personal absence - a zone where your own thoughts are deliberately suspended. The hostile pattern has nothing to latch to.

Monks discovered this centuries ago. We just gave it a name.`}]},{id:"b7",title:"DEEP ARCHIVE",desc:"Signal fragments too degraded for classification. Stored for future decoding.",gradient:"from-stone-800 via-neutral-900 to-zinc-900",chapters:[{id:"c8",title:"Fragment #044",content:`[UNRECOVERED HEADER]
